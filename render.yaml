services:
  - type: web
    name: hatsshopify
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_URL
        value: https://hatsshopify.onrender.com
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: hatsshopify-db
          property: connectionString
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      - key: PRINTFUL_API_KEY
        sync: false
      - key: PRINTFUL_STORE_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: hatsshopify-db
    plan: free
    databaseName: hatsshopify
    user: hatsshopify
